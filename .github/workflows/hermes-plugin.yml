name: native Hermes plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-plugin:
    name: native plugin (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: integrations/hermes-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[test]' 'build>=1.2,<2'
      - run: python -m pytest tests -q
      - run: python -m pip check
      - run: computer-view --help
      - run: python -m build
