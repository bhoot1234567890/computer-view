[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "computer-view"
version = "0.1.0"
description = "Self-hosted, passwordless computer access for AI agents and humans"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Computer View contributors"}]
keywords = ["agents", "novnc", "remote-desktop", "telegram", "hermes"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP :: HTTP Servers"]
dependencies = ["aiohttp>=3.14.5,<4"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.12,<1", "websocket-client>=1.9,<2"]

[project.scripts]
computer-view = "computer_view.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_view"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "integrations/", ".github/", "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md", "pyproject.toml", ".gitignore", ".env.example"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
