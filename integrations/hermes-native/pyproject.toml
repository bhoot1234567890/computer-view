[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-computer-view"
version = "0.1.0"
description = "Private owner-only Computer View gateway for Hermes"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "PyYAML==6.0.3"]

[project.scripts]
computer-view = "computer_view.cli:main"

[tool.setuptools.packages.find]
include = ["computer_view*"]
namespaces = true

[tool.setuptools.package-data]
computer_view = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
